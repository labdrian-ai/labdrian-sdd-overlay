name: Release Tagging

# overlay-release-identity R-002: on every push to main, compute the next
# semantic version from conventional-commit messages since the last release
# tag and push a new annotated vX.Y.Z tag -- unless HEAD is already tagged
# (a re-run for the same commit must never double-tag).

on:
  push:
    branches:
      - main

concurrency:
  group: release-tagging
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag-release:
    name: Cut release tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the bump computation walks conventional-commit
          # messages back to the last release tag, and `git describe` needs
          # the tag objects reachable, neither of which survives a shallow
          # (depth-1) checkout.
          fetch-depth: 0

      # Two different things reach this step, and only one of them is fine.
      #
      # A RE-RUN for a commit this workflow already tagged must skip: that is
      # what the exact-match check is for, and the tag it finds was written by
      # github-actions[bot].
      #
      # A HAND-TAGGED HEAD is not that. This workflow is the single writer of
      # versions -- it computes the bump from conventional-commit messages, so
      # the way to ask for a minor is to write `feat:` in the commit, not to
      # push a tag. A human tag that lands BEFORE this run makes the skip
      # above fire and silently REPLACES the computed version with a hand-
      # picked one, with nothing in a green log saying so. That happened once:
      # eeb3569 carries both v1.0.6 (this workflow's) and v1.1.0 (a hand tag
      # added after the run, so it did not suppress anything -- but a minute
      # earlier it would have).
      #
      # So the skip is no longer unconditional. A tag on HEAD that this
      # workflow did not write FAILS the run, loudly, because a skip that
      # looks like a pass is exactly how a silent replacement stays invisible.
      - name: Skip a re-run, refuse a hand-tagged HEAD
        id: check
        run: |
          set -euo pipefail

          tags="$(git tag --points-at HEAD --list 'v*')"
          if [[ -z "$tags" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          foreign=""
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            tagger="$(git for-each-ref --format='%(taggername)' "refs/tags/$tag")"
            if [[ "$tagger" != "github-actions[bot]" ]]; then
              foreign+="  $tag (tagged by: ${tagger:-<lightweight tag, no tagger>})"$'\n'
            fi
          done <<< "$tags"

          if [[ -n "$foreign" ]]; then
            {
              echo "HEAD carries a release tag this workflow did not write:"
              echo "$foreign"
              echo "Release tags are computed here, from conventional-commit messages"
              echo "since the last tag: '!' or 'BREAKING CHANGE:' -> major, 'feat:' -> minor,"
              echo "otherwise patch. Ask for a minor by writing 'feat:' in the commit, not by"
              echo "pushing a tag: a hand tag that lands before this run makes it skip, and the"
              echo "computed version is replaced without anything saying so."
              echo
              echo "To proceed: delete the hand tag (locally and on origin) and re-run, or leave"
              echo "it and accept it AS the release for this commit -- deliberately, not silently."
            } >&2
            exit 1
          fi

          echo "HEAD is already tagged by this workflow ($(echo "$tags" | tr '\n' ' ')); skipping."
          echo "skip=true" >> "$GITHUB_OUTPUT"

      - name: Compute next version and push the tag
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail

          last_tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"

          if [[ -z "$last_tag" ]]; then
            # Design decision D1 (pre-first-tag bootstrap): the first
            # qualifying run on main cuts v1.0.0 unconditionally, regardless
            # of commit history -- a daily-production tool warrants 1.0.0,
            # and a scripted first tag can never be forgotten.
            next_tag="v1.0.0"
          else
            log="$(git log "${last_tag}..HEAD" --pretty=format:'%s%n%b')"

            # Design decision D7: '!'-type or 'BREAKING CHANGE:' -> major;
            # 'feat:' -> minor; else patch. This bump logic is deliberately
            # inline here only (rejected: a bump helper in the CLI) -- a
            # misbump only mis-sizes an increment, it never breaks ordering,
            # and the consumer-side tag *resolution* is the tested surface.
            bump="patch"
            if echo "$log" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:' || echo "$log" | grep -qE '^BREAKING CHANGE:'; then
              bump="major"
            elif echo "$log" | grep -qE '^feat(\([^)]*\))?:'; then
              bump="minor"
            fi

            version="${last_tag#v}"
            IFS='.' read -r major minor patch <<< "$version"

            case "$bump" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac

            next_tag="v${major}.${minor}.${patch}"
          fi

          echo "Cutting release tag: $next_tag"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$next_tag" -m "Release $next_tag"
          git push origin "$next_tag"
