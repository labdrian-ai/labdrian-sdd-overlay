name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test-engine:
    name: Engine Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vet
        working-directory: engine
        run: go vet ./...

      - name: Test
        working-directory: engine
        run: go test ./... -cover

  test-tui:
    name: TUI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod

      - name: Vet
        working-directory: tui
        run: go vet ./...

      - name: Test
        working-directory: tui
        run: go test ./... -cover
