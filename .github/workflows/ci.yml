name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  lint-shell:
    name: Shell Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check bin/overlay
        run: bash -n bin/overlay && bash -n bin/labdrian-overlay

      - name: ShellCheck wrappers
        run: shellcheck bin/overlay bin/labdrian-overlay || true

  test-engine:
    name: Engine Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod

      - name: Gofmt
        working-directory: engine
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        working-directory: engine
        run: go vet ./...

      - name: Staticcheck
        working-directory: engine
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Deadcode (informational)
        working-directory: engine
        continue-on-error: true
        run: |
          out="$RUNNER_TEMP/deadcode-engine.txt"
          go run golang.org/x/tools/cmd/deadcode@v0.48.0 ./... > "$out" || true
          count=$(wc -l < "$out" | tr -d ' ')
          {
            echo "### Dead code — engine (informational)"
            echo
            echo "\`$count\` unreachable functions reported."
            if [ "$count" -gt 0 ]; then
              echo
              echo '```'
              head -n 10 "$out"
              [ "$count" -gt 10 ] && echo "... and $((count - 10)) more"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$out"

      - name: Test
        working-directory: engine
        run: go test ./... -cover

      - name: Validate skills registry
        working-directory: engine
        run: go run ./cmd/ skills validate --registry ../skills.registry.yaml --manifest ../overlay.manifest

  test-entry-contract-validator:
    name: Entry Contract Validator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/entry-contract-validator/go.mod

      - name: Test
        working-directory: tools/entry-contract-validator
        run: go test ./... -cover

      - name: Validate fixtures
        working-directory: tools/entry-contract-validator
        run: |
          go build -o "$RUNNER_TEMP/entry-contract-validator" .
          "$RUNNER_TEMP/entry-contract-validator" \
            --schema ../../skills/_shared/entry-contract.schema.json \
            --instance testdata/valid-entry-contract.json
          if "$RUNNER_TEMP/entry-contract-validator" \
            --schema ../../skills/_shared/entry-contract.schema.json \
            --instance testdata/invalid-entry-contract.json; then
            echo "invalid fixture was accepted" >&2
            exit 1
          else
            status=$?
          fi
          test "$status" -eq 5

  test-tui:
    name: TUI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod

      - name: Gofmt
        working-directory: tui
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        working-directory: tui
        run: go vet ./...

      - name: Staticcheck
        working-directory: tui
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Deadcode (informational)
        working-directory: tui
        continue-on-error: true
        run: |
          out="$RUNNER_TEMP/deadcode-tui.txt"
          go run golang.org/x/tools/cmd/deadcode@v0.48.0 ./... > "$out" || true
          count=$(wc -l < "$out" | tr -d ' ')
          {
            echo "### Dead code — tui (informational)"
            echo
            echo "\`$count\` unreachable functions reported."
            if [ "$count" -gt 0 ]; then
              echo
              echo '```'
              head -n 10 "$out"
              [ "$count" -gt 10 ] && echo "... and $((count - 10)) more"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$out"

      - name: Test
        working-directory: tui
        run: go test ./... -cover
