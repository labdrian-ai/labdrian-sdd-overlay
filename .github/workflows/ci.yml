name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  lint-shell:
    name: Shell Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check bin/overlay, bin/labdrian-overlay and its modules
        run: bash -n bin/overlay && bash -n bin/labdrian-overlay && for module in bin/lib/*.sh; do bash -n "$module"; done

      - name: ShellCheck wrappers and modules
        run: shellcheck bin/overlay bin/labdrian-overlay bin/lib/*.sh || true

      - name: Deterministic-checks dispatch guard smoke test
        run: |
          set +e
          missing_source_dir="$(mktemp -d)"
          err="$(OVERLAY_DIR="$missing_source_dir" bin/labdrian-overlay deterministic-checks check 2>&1 1>/dev/null)"
          status=$?
          set -e
          rm -rf "$missing_source_dir"
          if [ "$status" -ne 3 ]; then
            echo "expected exit 3 for missing runner source, got $status" >&2
            exit 1
          fi
          case "$err" in
            *"deterministic-check-runner source is unavailable"*) ;;
            *) echo "expected explicit stderr for missing runner source, got: $err" >&2; exit 1 ;;
          esac

          # Shadow PATH with only what runs before the go guard (bash itself,
          # via the #!/usr/bin/env bash shebang, plus dirname/readlink used by
          # the script's own path resolution), deliberately omitting go.
          shadow_bin="$(mktemp -d)"
          ln -s "$(command -v bash)" "$shadow_bin/bash"
          ln -s "$(command -v dirname)" "$shadow_bin/dirname"
          ln -s "$(command -v readlink)" "$shadow_bin/readlink"
          set +e
          err="$(PATH="$shadow_bin" bin/labdrian-overlay deterministic-checks check 2>&1 1>/dev/null)"
          status=$?
          set -e
          rm -rf "$shadow_bin"
          if [ "$status" -ne 3 ]; then
            echo "expected exit 3 for missing go, got $status" >&2
            exit 1
          fi
          case "$err" in
            *"go is required to build the deterministic-check-runner"*) ;;
            *) echo "expected explicit stderr for missing go, got: $err" >&2; exit 1 ;;
          esac

          echo "both deterministic-checks guards fired correctly (exit 3, explicit stderr)"

  test-engine:
    name: Engine Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, not the action's default shallow depth-1 clone.
          # engine/skills' D2 anchor test resolves its inputs from real
          # repository history (`git log ... origin/main`, `git show -s <sha>`).
          # Depth and ref layout are independent failure modes: the test names
          # origin/main so the ref resolves in a CI checkout, and this setting
          # makes the historical objects reachable. Both are required; either
          # one alone leaves the suite red.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod

      - name: Gofmt
        working-directory: engine
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        working-directory: engine
        run: go vet ./...

      # Built from tools/lint, whose go.mod and go.sum pin the version (see its README).
      - name: Staticcheck
        working-directory: engine
        run: |
          go build -C "$GITHUB_WORKSPACE/tools/lint" -o "$RUNNER_TEMP/staticcheck" honnef.co/go/tools/cmd/staticcheck
          "$RUNNER_TEMP/staticcheck" ./...

      # With -test, code reached only from tests counts as live, so every line deadcode prints is a
      # function nothing calls. The engine reports none, so any line fails the job. deadcode exits 0
      # when it reports findings, so the output decides, not the exit code.
      - name: Deadcode
        working-directory: engine
        run: |
          out=$(go run golang.org/x/tools/cmd/deadcode@v0.48.0 -test ./...)
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::deadcode -test reports unreachable functions; delete them or call them."
            exit 1
          fi

      - name: Test
        working-directory: engine
        run: go test ./... -cover

      - name: Validate skills registry
        working-directory: engine
        run: go run ./cmd/ skills validate --registry ../skills.registry.yaml --manifest ../overlay.manifest --source-root ../skills

      # The role agents are written by engine/agentgen from roles/<role>/body.md.
      # This fails when a committed agent file differs from what the generator writes.
      - name: Check generated agents
        working-directory: engine
        env:
          OVERLAY_DIR: ${{ github.workspace }}
        run: go run ./cmd/ gadu-generate --check

  test-entry-contract-validator:
    name: Entry Contract Validator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/entry-contract-validator/go.mod

      - name: Test
        working-directory: tools/entry-contract-validator
        run: go test ./... -cover

      - name: Validate fixtures
        working-directory: tools/entry-contract-validator
        run: |
          go build -o "$RUNNER_TEMP/entry-contract-validator" .
          "$RUNNER_TEMP/entry-contract-validator" \
            --schema ../../skills/_shared/entry-contract.schema.json \
            --instance testdata/valid-entry-contract.json
          if "$RUNNER_TEMP/entry-contract-validator" \
            --schema ../../skills/_shared/entry-contract.schema.json \
            --instance testdata/invalid-entry-contract.json; then
            echo "invalid fixture was accepted" >&2
            exit 1
          else
            status=$?
          fi
          test "$status" -eq 5

      # The fixtures above prove the validator's edges. This step proves the
      # contracts the repository actually carries still pass, so a schema or
      # validator change cannot silently invalidate real history.
      # --exists-root is deliberately NOT used here: archived contracts point at
      # change directories that archiving consumed.
      - name: Validate real entry contracts
        run: |
          go build -C tools/entry-contract-validator -o "$RUNNER_TEMP/entry-contract-validator" .
          shopt -s globstar nullglob
          validated=0
          skipped=0
          failed=0
          for contract in openspec/changes/**/entry.json; do
            status=0
            "$RUNNER_TEMP/entry-contract-validator" \
              --schema skills/_shared/entry-contract.schema.json \
              --instance "$contract" || status=$?
            case "$status" in
              0) validated=$((validated + 1)) ;;
              7) skipped=$((skipped + 1)); echo "SKIPPED pre-v2 legacy contract: $contract" ;;
              *) failed=$((failed + 1)); echo "::error file=$contract::entry-contract validation failed with exit $status" ;;
            esac
          done
          echo "entry contracts: $validated validated, $skipped skipped (pre-v2 legacy), $failed failed"
          test "$failed" -eq 0

  test-deterministic-check-runner:
    name: Deterministic Check Runner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/deterministic-check-runner/go.mod

      - name: Test
        working-directory: tools/deterministic-check-runner
        run: go test ./... -cover

  test-actuals-record-validator:
    name: Actuals Record Validator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/actuals-record-validator/go.mod

      - name: Gofmt
        working-directory: tools/actuals-record-validator
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        working-directory: tools/actuals-record-validator
        run: go vet ./...

      - name: Test
        working-directory: tools/actuals-record-validator
        run: go test ./... -cover

      # The two committed actuals records are the only ones this project has.
      # Validating them here, not only inside the Go tests, keeps the shipped
      # binary honest about the shipped data: a rule that rejects a record the
      # project already wrote would have blocked the closure that produced it.
      #
      # --repo is the checkout that holds the stored review results the
      # validator holds review_lens_count to (own-rdd S13), and it is an
      # absolute path. One committed record was written before the rows were
      # stored and claims a count taken from the receipt of another tool: the
      # validator refuses it by design (TestCommittedActualsFixturesValidate
      # pins that), and the fixture mirrors a live record byte for byte, so
      # that one record is validated here without that member. Every other
      # record, and any committed later, is validated as written.
      - name: Committed actuals records validate
        run: |
          set -euo pipefail
          go build -C tools/actuals-record-validator -o "$RUNNER_TEMP/actuals-record-validator" .
          for record in engine/skills/testdata/corrected-actuals-*.json; do
            instance=$record
            if [ "$(basename "$record")" = corrected-actuals-skills-validate-ondisk-gate.json ]; then
              jq 'del(.review_lens_count)' "$record" > "$RUNNER_TEMP/actuals-record.json"
              instance="$RUNNER_TEMP/actuals-record.json"
            fi
            "$RUNNER_TEMP/actuals-record-validator" \
              --schema skills/_shared/actuals-record.schema.json \
              --instance "$instance" \
              --repo "$PWD"
          done

  test-archive-anchor-gate:
    name: Archive Anchor Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The gate resolves recorded landing commits with `git show`, so a
          # shallow clone would make a truthful anchor look unresolvable.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/archive-anchor-gate/go.mod

      - name: Gofmt
        working-directory: tools/archive-anchor-gate
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        working-directory: tools/archive-anchor-gate
        run: go vet ./...

      - name: Test
        working-directory: tools/archive-anchor-gate
        run: go test ./... -cover

      # The behavioural half. Every archive report written under the anchor
      # convention either carries a resolvable landing commit — verified against
      # `git show -s --format=%T` when a tree was recorded — or explicitly
      # records the absent/self-asserted/rejected outcome. Declared gaps live in
      # known-gaps.txt; a gap that closes fails the run as a stale waiver, so the
      # ledger cannot outlive the gap it describes.
      - name: Archive reports carry a resolvable anchor
        run: |
          set -euo pipefail
          # -C changes the process working directory, so --repo is absolute and
          # --known-gaps is resolved inside the tool's own module directory.
          go run -C tools/archive-anchor-gate . \
            --repo "$PWD" \
            --known-gaps known-gaps.txt

  review-anchor:
    name: Merge Lands A Reviewed Tree
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The merge base and the chain of reviews read the whole history.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod

      - name: The merge lands a reviewed tree
        working-directory: engine
        run: go run ./cmd/ review anchor --merge HEAD

  test-archive-reconcile:
    name: Archive Reconcile Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/archive-reconcile/go.mod

      - name: Gofmt
        working-directory: tools/archive-reconcile
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        working-directory: tools/archive-reconcile
        run: go vet ./...

      - name: Test
        working-directory: tools/archive-reconcile
        run: go test ./... -cover

      # This job, not lint-shell, owns the end-to-end assertion: reaching the
      # guard itself requires building it, so it belongs where the toolchain is
      # pinned by go-version-file rather than assumed present on the runner.
      #
      # Unlike the module's own tests above, this step is a live gate on this
      # checkout's actual openspec/changes/ state, not a fixture. It is
      # expected to be RED whenever a stranded change is genuinely present —
      # that is the exact condition this guard exists to surface, not a test
      # bug. Do not add tolerance for a non-zero exit here to keep this job
      # green; that would defeat the guard it exists to run.
      #
      # Declared gaps live in known-gaps.txt, exactly as they do for the
      # sibling archive-anchor-gate job: every line there is a change this
      # guard genuinely fails on today. That ledger is a record, not an
      # exemption — a NEW stranded or undetermined change is not on it and
      # still fails this step, and a listed change that stops failing fails
      # this step as a stale waiver until its line is deleted. Do not add
      # entries to keep the job green.
      # Invoked through the overlay wrapper, not `go run` directly. The wrapper
      # is the only surface a maintainer actually types, and it carries real
      # behaviour of its own: it builds the guard, runs it from $CALLER_CWD,
      # and remaps the one exit-1 case that would otherwise read as "stranded
      # change found" when the caller's directory has vanished. This step is
      # its ONLY invocation anywhere -- nothing in engine/shelltest covers it --
      # so calling the binary directly here would leave that wrapper untested
      # while this comment still claimed the job owns the end-to-end assertion.
      #
      # The ledger path is REPOSITORY-RELATIVE on purpose: the wrapper runs the
      # guard from $CALLER_CWD, so "known-gaps.txt" alone would resolve against
      # whatever directory the caller happened to be in, not the tool's module
      # directory. That is the same trap that made --exists-root a gate no
      # contract could pass.
      - name: Archive reconcile guard against this repository
        run: |
          set -euo pipefail
          bin/labdrian-overlay archive-reconcile \
            --repo "$PWD" \
            --known-gaps tools/archive-reconcile/known-gaps.txt

  test-tui:
    name: TUI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod

      - name: Gofmt
        working-directory: tui
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      # The backend tests of the tui (`*_backend_test.go`, which build the engine and run the overlay
      # script) are behind the `backend` build tag, so a local `go test ./...` is fast and needs no
      # engine; every step here that reads test files passes the tag, so CI still vets, lints and runs them.
      - name: Vet
        working-directory: tui
        run: go vet -tags backend ./...

      # Built from tools/lint, whose go.mod and go.sum pin the version (see its README).
      - name: Staticcheck
        working-directory: tui
        run: |
          go build -C "$GITHUB_WORKSPACE/tools/lint" -o "$RUNNER_TEMP/staticcheck" honnef.co/go/tools/cmd/staticcheck
          "$RUNNER_TEMP/staticcheck" -tags backend ./...

      # The same gate as the engine's Deadcode step, with the backend tag like the steps above.
      - name: Deadcode
        working-directory: tui
        run: |
          out=$(go run golang.org/x/tools/cmd/deadcode@v0.48.0 -test -tags backend ./...)
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::deadcode -test reports unreachable functions; delete them or call them."
            exit 1
          fi

      - name: Test
        working-directory: tui
        run: go test -tags backend ./... -cover

  test-longterm-mem:
    name: Longterm-Mem Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: longterm-mem/go.mod

      - name: Gofmt
        working-directory: longterm-mem
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        working-directory: longterm-mem
        run: go vet ./...

      # Built from tools/lint, whose go.mod and go.sum pin the version (see its README).
      - name: Staticcheck
        working-directory: longterm-mem
        run: |
          go build -C "$GITHUB_WORKSPACE/tools/lint" -o "$RUNNER_TEMP/staticcheck" honnef.co/go/tools/cmd/staticcheck
          "$RUNNER_TEMP/staticcheck" ./...

      - name: Test
        working-directory: longterm-mem
        run: go test ./... -cover

  # archguard is the checker behind the architecture tests of engine and
  # longterm-mem. Those two jobs already build and run it: each module requires it
  # with a local replace (../archguard), and the checkout above is the whole
  # repository, so no network and no workflow change is needed for them. This job
  # is for archguard's own tests, which are not part of either module.
  test-archguard:
    name: Archguard Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: archguard/go.mod

      - name: Gofmt
        working-directory: archguard
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        working-directory: archguard
        run: go vet ./...

      # Built from tools/lint, whose go.mod and go.sum pin the version (see its README).
      - name: Staticcheck
        working-directory: archguard
        run: |
          go build -C "$GITHUB_WORKSPACE/tools/lint" -o "$RUNNER_TEMP/staticcheck" honnef.co/go/tools/cmd/staticcheck
          "$RUNNER_TEMP/staticcheck" ./...

      - name: Test
        working-directory: archguard
        run: go test ./... -cover

  # identity holds the rules that turn what a git repository says about itself into
  # the name of its project (Phase 9, D2). Engine and longterm-mem both require it
  # from their production code through a local replace (../identity); this job is
  # for its own tests and its recorded vectors. Only longterm-mem runs those vectors
  # through its own reader of the repository today; the engine's agreement with them
  # is not yet proved by a test of its own.
  test-identity:
    name: Identity Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: identity/go.mod

      - name: Gofmt
        working-directory: identity
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        working-directory: identity
        run: go vet ./...

      # Built from tools/lint, whose go.mod and go.sum pin the version (see its README).
      - name: Staticcheck
        working-directory: identity
        run: |
          go build -C "$GITHUB_WORKSPACE/tools/lint" -o "$RUNNER_TEMP/staticcheck" honnef.co/go/tools/cmd/staticcheck
          "$RUNNER_TEMP/staticcheck" ./...

      - name: Test
        working-directory: identity
        run: go test ./... -cover

  test-telemetry:
    name: Telemetry Cost Baseline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: telemetry/go.mod

      - name: Gofmt
        working-directory: telemetry
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        working-directory: telemetry
        run: go vet ./...

      # Built from tools/lint, whose go.mod and go.sum pin the version (see its README).
      - name: Staticcheck
        working-directory: telemetry
        run: |
          go build -C "$GITHUB_WORKSPACE/tools/lint" -o "$RUNNER_TEMP/staticcheck" honnef.co/go/tools/cmd/staticcheck
          "$RUNNER_TEMP/staticcheck" ./...

      - name: Test
        working-directory: telemetry
        run: go test -count=1 ./... -cover
