# ST1005 is disabled for this module.
#
# ST1005 flags error strings that begin with a capital letter. Every finding it
# raises here is an error message that legitimately opens with a product name --
# "Claude config root could not be resolved; set HOME", "Codex config root
# directory could not be prepared: %w". staticcheck cannot distinguish a proper
# noun from an ordinary capitalized word, so honouring the rule would force
# "claude config root ..." and "codex config root ...", which reads as a typo
# rather than as the name of the runtime the error is about.
#
# Every other check stays enabled, including the ones that caught real defects
# when this gate was first introduced: SA1006 (printf-style call with a dynamic
# format string and no arguments) and U1000 (unused identifier).
checks = ["inherit", "-ST1005"]
